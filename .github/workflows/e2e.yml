name: e2e

# The browser smoke test (frontend/e2e) against a throwaway copy of the
# deployed stack, built from the pull request's tree: the Caddyfile, the
# compose files, the migrations and the three images, signed in as an
# administrator and a participant in a real Chromium. The unit and integration
# jobs cannot see a defect that only shows once those pieces run together.
#
# It needs no secret. frontend/e2e/stack.sh generates every password and token
# for the run, the stack listens on loopback only, and it is removed with the
# runner. A pull request from a fork therefore runs it exactly like one from
# this repository, and it never runs a fork's code with this repository's
# privileges.
#
# It is not a required check: a path-filtered workflow cannot be one (see the
# note in backend.yml), and how steady a browser suite is on a shared runner
# has not been measured yet. It becomes required through an always-running
# gate job once it has stayed green for two weeks.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/docker-compose.yml"
      - "deploy/docker-compose.build.yml"
      - "deploy/Caddyfile"
      - "Makefile"
      - ".github/workflows/e2e.yml"
      - "!**/*.md"
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: browser smoke test
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The runner context is not available in a job-level env block.
      - name: Choose the stack directory
        run: echo "E2E_STACK_DIR=$RUNNER_TEMP/e2e-stack" >> "$GITHUB_ENV"

      - run: make front-install

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the throwaway stack
        run: make e2e-stack-up

      # Guards this run's log only. The values belong to a stack that dies with
      # the runner; the uploaded artifact is redacted separately (redact.sh).
      - name: Mask the generated secrets
        run: |
          set -euo pipefail
          while IFS='=' read -r key value; do
            case "$key" in
            *PASSWORD | *SECRET | *TOKEN) [ -z "$value" ] || echo "::add-mask::$value" ;;
            esac
          done <"$E2E_STACK_DIR/stack.env"
          password="$(sed -n 's/^E2E_ADMIN_PASSWORD=//p' "$E2E_STACK_DIR/smoke.env")"
          echo "::add-mask::$password"

      - name: Run the smoke test
        run: make e2e-smoke E2E_ENV_FILE="$E2E_STACK_DIR/smoke.env"

      # Only screenshots and container output are staged: the stack directory
      # (smoke.env, stack.env) holds the run's passwords and is never copied;
      # a trace is too, and E2E_TRACE is never set, so any .zip is removed.
      # Staging one directory keeps the artifact's layout at test-results/ and
      # e2e-logs/. A cancelled run (the timeout) still leaves its logs. A failing CREATE ROLE ... PASSWORD can be logged
      # by the game cluster, and ::add-mask:: does not reach uploaded files, so
      # every generated secret is redacted from the staged text first; this runs
      # even when the stack never came up, as stack.sh writes its env file first.
      - name: Collect screenshots and container logs
        if: failure() || cancelled()
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/e2e-artifact"
          mkdir -p "$stage/e2e-logs" "$stage/test-results"
          cp -R frontend/test-results/. "$stage/test-results/" 2>/dev/null || true
          find "$stage/test-results" -name '*.zip' -delete
          for id in $(docker ps -aq --filter label=com.docker.compose.project=dbcontest-e2e); do
            name="$(docker inspect --format '{{.Name}}' "$id")"
            docker logs "$id" >"$stage/e2e-logs/${name#/}.log" 2>&1 || true
          done
          frontend/e2e/redact.sh "$stage" "$E2E_STACK_DIR"

      - name: Upload screenshots and logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failure
          path: ${{ runner.temp }}/e2e-artifact
          if-no-files-found: warn
          retention-days: 7

      - name: Remove the stack
        if: always()
        run: make e2e-stack-down
