name: frontend

# Only what this component owns, plus the API's published contracts: the error
# dictionary is checked against docs/api/error-codes.json, and the audit
# dictionary against docs/api/audit-actions.json, so a change to either is a
# change to what this interface must be able to say. Those files are the
# entire dependency — nothing here reads the server's source.
#
# See the note in backend.yml before making these required checks.
# Images for the interface are built on every push to main and published only
# from a tag. Building on a merge is the only check the Dockerfile and the
# shape of the dependency graph get — the tests pass happily on code that
# cannot be built into the image — while the registry holds deliberate
# releases rather than one image per merge. Pull requests build nothing:
# a draft or an accidental one should not cost an image build.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "frontend/**"
      - "docs/api/error-codes.json"
      - "docs/api/audit-actions.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "docs/api/error-codes.json"
      - "docs/api/audit-actions.json"
      - ".github/workflows/frontend.yml"

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The design system's guarantees, checked before anything is built. Each
      # catches a class of defect that is invisible in review: a colour written
      # by hand, a type step invented on the spot, a contrast failure that
      # looks fine to somebody who already knows what it says, and an API code
      # nobody wrote a message for.
      - name: Lint
        run: npm run lint

      - name: Contrast of the palette in both themes
        run: npm run contrast

      # This one was claimed by the comment above long before anything checked
      # it, and `text-h1` shipped on two headings in the meantime: the erased
      # stock scale means an unknown step emits no CSS and says nothing.
      - name: Every text-* class names a real step
        run: npm run type-scale

      - name: Every API error code has a message
        run: npm run error-codes

      - name: Types
        run: npm run typecheck

      - run: npm test

      - run: npm run build

  # Same shape as the backend's: a merge proves the image builds, a tag
  # publishes it, and only the second holds a token that can write to the
  # registry.

  build-image:
    name: build the image
    needs: build
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: ./.github/workflows/image.yml
    with:
      context: frontend
      target: runtime
      image: db-contest-frontend
      publish: false

  publish-image:
    name: publish the image
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      context: frontend
      target: runtime
      image: db-contest-frontend
      publish: true
