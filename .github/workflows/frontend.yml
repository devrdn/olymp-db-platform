name: frontend

# Only what this component owns, plus the API's published contract: the error
# dictionary is checked against docs/api/error-codes.json, so a change there is
# a change to what this interface must be able to say. That file is the entire
# dependency — nothing here reads the server's source.
#
# See the note in backend.yml before making these required checks.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "frontend/**"
      - "docs/api/error-codes.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "docs/api/error-codes.json"
      - ".github/workflows/frontend.yml"

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The design system's guarantees, checked before anything is built. Each
      # catches a class of defect that is invisible in review: a colour written
      # by hand, a type step invented on the spot, a contrast failure that
      # looks fine to somebody who already knows what it says, and an API code
      # nobody wrote a message for.
      - name: Lint
        run: npm run lint

      - name: Contrast of the palette in both themes
        run: npm run contrast

      # This one was claimed by the comment above long before anything checked
      # it, and `text-h1` shipped on two headings in the meantime: the erased
      # stock scale means an unknown step emits no CSS and says nothing.
      - name: Every text-* class names a real step
        run: npm run type-scale

      - name: Every API error code has a message
        run: npm run error-codes

      - name: Types
        run: npm run typecheck

      - run: npm test

      - run: npm run build

  publish:
    name: build and publish the image
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The GitHub Actions cache backend is an exporter, and only the
      # docker-container driver can export. Without this step the runner's
      # default `docker` driver refuses the build outright — before compiling
      # anything, which is why the job used to fail in seconds with an error
      # about cache backends rather than about the code.
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/db-contest-frontend
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{raw}}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
