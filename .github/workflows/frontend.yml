name: frontend

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The design system's three guarantees, checked before anything is built.
      # Each catches a class of defect that is invisible in review: a colour
      # written by hand, a type step invented on the spot, and a contrast
      # failure that looks fine to somebody who already knows what it says.
      - name: Lint
        run: npm run lint

      - name: Contrast of the palette in both themes
        run: npm run contrast

      - name: Every API error code has a message
        run: npm run error-codes

      - name: Types
        run: npm run typecheck

      - run: npm test

      - run: npm run build
