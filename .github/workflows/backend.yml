name: backend

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest

    # The repository tests run their SQL against a real PostgreSQL. Without a
    # database they skip, which is right for a developer with none to hand and
    # wrong for CI: a query is the one thing a fake cannot verify.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dbcontest
          POSTGRES_PASSWORD: dbcontest
          POSTGRES_DB: dbcontest_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbcontest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CORE_DB_DSN: postgres://dbcontest:dbcontest@localhost:5432/dbcontest_core?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go vet ./...

      - name: Apply the migrations
        run: go run ./cmd/migrate up

      - name: Test with the race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - run: go build ./...

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Reports known vulnerabilities in the dependency graph and the toolchain.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Static analysis for common Go security mistakes.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-generated ./...
