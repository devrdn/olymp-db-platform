name: backend

# Only what this component owns. The interface used to have to run on every
# backend change, because its contract check read the Go sources; it now reads
# the file the backend generates, so the two are independent and their paths
# can say so.
#
# One caveat before turning these into *required* checks in branch protection:
# a filtered workflow does not run at all on an unrelated change, and a
# required check that never runs blocks the pull request forever. Make the
# required check a small job that always runs and depends on these, rather
# than these directly.
# Images for the API and the Query Runner are built on every push to main and published only
# from a tag. Building on a merge is the only check the Dockerfile and the
# shape of the dependency graph get — the tests pass happily on code that
# cannot be built into the image — while the registry holds deliberate
# releases rather than one image per merge. Pull requests build nothing:
# a draft or an accidental one should not cost an image build.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest

    # The repository tests run their SQL against a real PostgreSQL. Without a
    # database they skip, which is right for a developer with none to hand and
    # wrong for CI: a query is the one thing a fake cannot verify.
    #
    # Two clusters, because the product has two. The core database holds the
    # platform's own tables; the game cluster is where an organiser's script
    # is executed and a participant's copy lives, and every guarantee
    # internal/gamedb makes is a guarantee about what PostgreSQL refuses to a
    # particular role — which cannot be faked and cannot be checked from the
    # core database either (CLAUDE.md rule 10). Until this second service
    # existed, GAME_DB_DSN was unset here, gamedbtest skipped on it, and the
    # whole of internal/gamedb plus both end-to-end build tests were silently
    # not run on any pull request: the CI output said "ok".
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dbcontest
          POSTGRES_PASSWORD: dbcontest
          POSTGRES_DB: dbcontest_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbcontest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The game cluster, as deploy/docker-compose.yml starts it: the
      # provisioning role owns it, and the three roles the tests prepare
      # (game_reader, game_writer, game_author) are created by the tests
      # themselves through gamedb.PrepareCluster. Published on 5433, the port
      # the development overlay uses, so nothing about a DSN differs between
      # a developer's stack and this one.
      postgres-game:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dbcontest_game
          POSTGRES_PASSWORD: dbcontest
          POSTGRES_DB: dbcontest_game
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dbcontest_game"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # A literal, not a secret, and deliberately so. It has to match the
    # password three lines above, in this same file; hiding one half of a pair
    # in GitHub Secrets would conceal nothing and would suggest something here
    # is protected. The database it names is created by this job on the runner,
    # holds only fixtures the tests roll back, is reachable from nowhere else,
    # and is destroyed with the virtual machine minutes later.
    #
    # The credentials that do matter — deploy/.env — are on the installation's
    # own host and never come near this file.
    #
    # The same reasoning covers the game cluster's four values below.
    # GAME_DB_DSN connects as the provisioning role; the three role passwords
    # are what gamedbtest writes onto game_reader, game_writer and
    # game_author while preparing the cluster. On a developer's machine those
    # three are shared with a running Query Runner, which is why `make
    # test-game` insists on taking them from deploy/.env rather than inventing
    # any (gamedbtest's own package doc). Here there is no Query Runner and no
    # cluster older than this job, so a literal is the honest form: it names
    # what the tests will set, on a container destroyed with the runner.
    env:
      CORE_DB_DSN: postgres://dbcontest:dbcontest@localhost:5432/dbcontest_core?sslmode=disable
      GAME_DB_DSN: postgres://dbcontest_game:dbcontest@localhost:5433/dbcontest_game?sslmode=disable
      GAME_READER_PASSWORD: dbcontest
      GAME_WRITER_PASSWORD: dbcontest
      GAME_AUTHOR_PASSWORD: dbcontest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go vet ./...

      # The API's binaries run on an image with no libc, so an accidental cgo
      # dependency has to fail here rather than in the publish job — or, worse,
      # produce an image that cannot start.
      - name: the API builds without cgo
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/api ./cmd/migrate ./cmd/bootstrap

      - name: Apply the migrations
        run: go run ./cmd/migrate up

      # One command for both clusters. `./...` is what makes this the check
      # that cannot drift: a package added later is covered by it, and with
      # GAME_DB_DSN set above the game-cluster tests and the two cross-cluster
      # build tests in internal/provisioning run here rather than skipping.
      # There is no separate `make test-game` step because there is nothing
      # for it to add — the Makefile target exists to pass a developer's own
      # deploy/.env into the same packages.
      - name: Test with the race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - run: go build ./...

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Reports known vulnerabilities in the dependency graph and the toolchain.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Static analysis for common Go security mistakes.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-generated ./...

  # Publishing is what makes a deploy possible without a compiler on the server:
  # the image CI proved is the image that runs. Only on main and on tags — a
  # pull request is not something anybody should be able to deploy.
  # Building on a merge and publishing from a tag are the same work with
  # different permissions, so they are the same reusable workflow called twice.
  # A merge proves the image can be built — the only check the Dockerfile and
  # the shape of the dependency graph ever get — while the registry keeps
  # deliberate releases rather than one image per merge.
  #
  # The matrix is the list of images, which is data. Repeating it under both
  # callers is cheaper than the alternative: permissions cannot be made
  # conditional, so one job cannot be both.

  build-images:
    name: build the images
    needs: [build, security]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: runtime
            image: db-contest-backend
            expect: usr/local/bin/api
          - target: queryrunner
            image: db-contest-queryrunner
            expect: usr/local/bin/queryrunner
    uses: ./.github/workflows/image.yml
    with:
      context: backend
      target: ${{ matrix.target }}
      image: ${{ matrix.image }}
      expect: ${{ matrix.expect }}
      publish: false

  publish-images:
    name: publish the images
    needs: [build, security]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: runtime
            image: db-contest-backend
            expect: usr/local/bin/api
          - target: queryrunner
            image: db-contest-queryrunner
            expect: usr/local/bin/queryrunner
    uses: ./.github/workflows/image.yml
    with:
      context: backend
      target: ${{ matrix.target }}
      image: ${{ matrix.image }}
      expect: ${{ matrix.expect }}
      publish: true
