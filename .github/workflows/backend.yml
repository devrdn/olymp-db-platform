name: backend

# Only what this component owns. The interface used to have to run on every
# backend change, because its contract check read the Go sources; it now reads
# the file the backend generates, so the two are independent and their paths
# can say so.
#
# One caveat before turning these into *required* checks in branch protection:
# a filtered workflow does not run at all on an unrelated change, and a
# required check that never runs blocks the pull request forever. Make the
# required check a small job that always runs and depends on these, rather
# than these directly.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest

    # The repository tests run their SQL against a real PostgreSQL. Without a
    # database they skip, which is right for a developer with none to hand and
    # wrong for CI: a query is the one thing a fake cannot verify.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dbcontest
          POSTGRES_PASSWORD: dbcontest
          POSTGRES_DB: dbcontest_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbcontest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # A literal, not a secret, and deliberately so. It has to match the
    # password three lines above, in this same file; hiding one half of a pair
    # in GitHub Secrets would conceal nothing and would suggest something here
    # is protected. The database it names is created by this job on the runner,
    # holds only fixtures the tests roll back, is reachable from nowhere else,
    # and is destroyed with the virtual machine minutes later.
    #
    # The credentials that do matter — deploy/.env — are on the installation's
    # own host and never come near this file.
    env:
      CORE_DB_DSN: postgres://dbcontest:dbcontest@localhost:5432/dbcontest_core?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go vet ./...

      # The API's binaries run on an image with no libc, so an accidental cgo
      # dependency has to fail here rather than in the publish job — or, worse,
      # produce an image that cannot start.
      - name: the API builds without cgo
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/api ./cmd/migrate ./cmd/bootstrap

      - name: Apply the migrations
        run: go run ./cmd/migrate up

      - name: Test with the race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - run: go build ./...

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Reports known vulnerabilities in the dependency graph and the toolchain.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Static analysis for common Go security mistakes.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-generated ./...

  # Publishing is what makes a deploy possible without a compiler on the server:
  # the image CI proved is the image that runs. Only on main and on tags — a
  # pull request is not something anybody should be able to deploy.
  publish:
    name: build and publish the image
    # Nothing is published that failed either gate, including the scan.
    needs: [build, security]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags on every image: the commit it was built from, which is
      # unambiguous and never reused, and a moving one for convenience. A
      # deploy names a version explicitly; nothing deploys "latest".
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/db-contest-backend
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{raw}}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          # Named explicitly. A build with no target produces the *last* stage
          # in the Dockerfile, so adding the Query Runner's stages at the end
          # silently turned this into a Query Runner image published under the
          # backend's name — with no /usr/local/bin/api in it.
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Query Runner is a second image because it is a different build:
      # cgo and a libc, which the other binaries neither need nor should carry.
      # Published from here so that a deploy can pull what compose names.
      - id: meta-runner
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/db-contest-queryrunner
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{raw}}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: queryrunner
          push: true
          tags: ${{ steps.meta-runner.outputs.tags }}
          labels: ${{ steps.meta-runner.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # What each image actually contains, asserted rather than assumed. This
      # is the check that would have caught the wrong stage being published,
      # and it costs a second.
      - name: the images carry the binaries they are named for
        run: |
          set -eu
          api=$(echo '${{ steps.meta.outputs.tags }}' | head -1)
          runner=$(echo '${{ steps.meta-runner.outputs.tags }}' | head -1)
          docker run --rm --entrypoint /usr/local/bin/api "$api" -healthcheck 2>/dev/null || true
          docker run --rm --entrypoint /bin/sh "$api" -c 'true' 2>/dev/null || true
          docker create --name check-api "$api" >/dev/null
          docker export check-api | tar -t | grep -q '^usr/local/bin/api$' \
            || { echo "the backend image has no /usr/local/bin/api"; exit 1; }
          docker rm check-api >/dev/null
          docker create --name check-runner "$runner" >/dev/null
          docker export check-runner | tar -t | grep -q '^usr/local/bin/queryrunner$' \
            || { echo "the query runner image has no /usr/local/bin/queryrunner"; exit 1; }
          docker rm check-runner >/dev/null
