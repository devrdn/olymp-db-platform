# Building one image for linux/amd64 and linux/arm64, and publishing it only
# when asked.
#
# A reusable workflow rather than a step somebody copies. Two things made that
# the right shape:
#
#   - Permissions in GitHub Actions are declared per job and cannot be made
#     conditional. Publishing needs `packages: write`; building to check that
#     the image *can* be built needs nothing. Keeping them in one job would
#     mean every merge running third-party build dependencies with a token that
#     can write to the registry.
#   - The alternative — the same forty lines in a build job and a publish job,
#     twice over because the backend has two images — is two definitions that
#     must stay identical. This repository has already been bitten by two
#     lists that agreed on the day they were written.
#
# The caller decides which of the two it is, and grants the permission that
# goes with it.
#
# Each platform builds on a runner of its own architecture: under QEMU the
# pg_query C build and `next build` run several times slower, and a public
# repository's arm64 runners cost nothing. On a publish each platform pushes
# its image by digest alone, and `manifest` names both digests under the tags
# only after both platform jobs passed their checks, so no tag ever points at
# one platform, or at a platform whose check failed.

name: image

on:
  workflow_call:
    inputs:
      context:
        description: The build context, relative to the repository root.
        required: true
        type: string
      target:
        description: The Dockerfile stage to build. Named explicitly, because a
          build with no target produces the last stage in the file.
        required: true
        type: string
      image:
        description: The image name under the owner, without the registry.
        required: true
        type: string
      expect:
        description: A path the built image must contain, asserted before it is
          published. Empty to skip.
        required: false
        default: ""
        type: string
      owned:
        description: Directories the built image must contain and who must own
          them, as space-separated path:uid pairs (paths without the leading
          slash). Empty to skip.
        required: false
        default: ""
        type: string
      publish:
        description: Whether to push. False builds and throws the result away,
          which is the point on a merge.
        required: false
        default: false
        type: boolean

# No `permissions` here, nor on the jobs below. A called workflow may only
# narrow what its caller granted, so a block at this level would cap every
# caller at it: a `contents: read` here left the publishing caller's
# `packages: write` with nothing, and the first tag's push was refused by the
# registry. The caller's job decides, as the header says: on a publish both
# jobs below push, and on a merge neither holds more than `contents: read`.

jobs:
  image:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    # Every action is pinned to a commit, not a tag: on a publish this job
    # holds a token that can push the images a server deploys, and a tag is
    # whatever its owner last pointed it at.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The GitHub Actions cache backend is an exporter, and only the
      # docker-container driver can export. Without this the runner's default
      # `docker` driver refuses the build outright, before compiling anything.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - if: inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags on every image: the commit it was built from, which is
      # unambiguous and never reused, and a moving one for convenience. A
      # deploy names a version explicitly; nothing deploys "latest".
      # Anchored, because `manifest` must compute exactly these tags.
      - &metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{raw}}

      # On a merge the image is loaded into the local daemon under its tags and
      # goes no further. On a publish it is pushed by digest with no tag at
      # all: the tags are `manifest`'s to give, once both platforms exist.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.context }}
          target: ${{ inputs.target }}
          platforms: ${{ matrix.platform }}
          load: ${{ !inputs.publish }}
          outputs: ${{ inputs.publish && format('type=image,name=ghcr.io/{0}/{1},push-by-digest=true,name-canonical=true,push=true', github.repository_owner, inputs.image) || '' }}
          tags: ${{ !inputs.publish && steps.meta.outputs.tags || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
          cache-from: type=gha,scope=${{ inputs.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}-${{ matrix.arch }}

      # The check below then reads the image back from the registry rather than
      # from the builder, so what it passes is the digest the tags will name.
      - name: pull back what was pushed
        id: pushed
        if: inputs.publish
        run: |
          set -euo pipefail
          if ! [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "the build reported no digest: '$DIGEST'"
            exit 1
          fi
          ref="ghcr.io/$OWNER/$IMAGE@$DIGEST"
          docker pull "$ref"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # What the image actually contains, asserted rather than assumed. This is
      # the check that catches the wrong stage being built — which happened,
      # and produced an image named for the API with no api binary in it —
      # and a build that quietly produced the other platform.
      #
      # And who owns what a volume will be mounted on. A new named volume is
      # initialised from the image's directory at its mount point, ownership
      # included; where the image has no such directory the volume's root is
      # root's, and a process running as nonroot cannot write to it — the API
      # restarted forever on a fresh install for exactly that.
      - name: the image carries what it is meant to
        run: |
          set -euo pipefail
          image=${PUSHED:-$(echo "$TAGS" | head -1)}
          failed=0

          arch=$(docker image inspect --format '{{.Architecture}}' "$image")
          if [ "$arch" != "$ARCH" ]; then
            echo "$image is built for $arch, not $ARCH"
            failed=1
          fi

          listing="$RUNNER_TEMP/image-listing"
          docker create --name check "$image" >/dev/null
          # Listed to a file first: a reader that stops at the first match
          # closes the pipe while tar is still writing to it.
          docker export check | tar -tv --numeric-owner >"$listing"
          docker rm check >/dev/null

          if [ -n "$EXPECT" ] && ! awk -v want="$EXPECT" \
              '$6 == want { found = 1 } END { exit !found }' "$listing"; then
            echo "$image has no $EXPECT"
            failed=1
          fi
          for entry in $OWNED; do
            dir=${entry%:*}
            uid=${entry##*:}
            if ! awk -v want="$dir/" -v uid="$uid" \
                '$6 == want && $1 ~ /^d/ { split($2, who, "/"); if (who[1] == uid) found = 1 }
                 END { exit !found }' "$listing"; then
              echo "$image has no directory $dir owned by uid $uid"
              failed=1
            fi
          done
          exit "$failed"
        env:
          PUSHED: ${{ steps.pushed.outputs.ref }}
          TAGS: ${{ steps.meta.outputs.tags }}
          ARCH: ${{ matrix.arch }}
          EXPECT: ${{ inputs.expect }}
          OWNED: ${{ inputs.owned }}

      # Handed to `manifest` only from here, after the check passed: a digest
      # that failed it is never uploaded, and `manifest` does not run.
      - name: record the digest
        if: inputs.publish
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      # `overwrite`, because a re-run of the whole workflow uploads the same
      # name again within the same run.
      - if: inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ inputs.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  manifest:
    runs-on: ubuntu-24.04
    needs: image
    if: inputs.publish

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - *metadata

      - name: tag both platforms under one name
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          shopt -s nullglob
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "expected a digest from each of the two platforms, got ${#digests[@]}"
            exit 1
          fi

          args=()
          while read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          if [ "${#args[@]}" -eq 0 ]; then
            echo "the metadata step produced no tags"
            exit 1
          fi
          for digest in "${digests[@]}"; do
            args+=("ghcr.io/$OWNER/$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

          # Attestations are listed as platform unknown/unknown and left out.
          first=$(jq -r '.tags[0]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          platforms=$(docker buildx imagetools inspect --raw "$first" \
            | jq -r '.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"' \
            | sort | paste -sd ' ' -)
          if [ "$platforms" != "linux/amd64 linux/arm64" ]; then
            echo "$first lists '$platforms', not linux/amd64 and linux/arm64"
            exit 1
          fi
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.image }}
