edition = "2023";

// The contract between the Core API and the Query Runner.
//
// The Query Runner is the one component that is a separate service (section
// 2.3), and this file is the whole of what the two say to each other. Two
// reasons for the split, and the second is the one worth remembering:
//
//   - The runner links PostgreSQL's own parser through cgo, to check a query
//     before running it. That is C code reading text an adversary chooses, and
//     a crash in it takes down the process rather than raising an error a
//     recover can catch. In one process with the Core API, a crafted query
//     would be a repeatable way to end sign-in, the timer and the submission
//     of answers — the very things section 4 insists must survive everything.
//   - Only this service holds the participants' roles and runs their SQL; the
//     Core API connects to the game cluster only as the provisioning role, to
//     build templates and copies. In one process, a fault anywhere in the API
//     would be within reach of every participant's database as those roles.
//
// Scaling is *not* among the reasons. On one on-premise machine serving a few
// hundred participants, nobody is going to replicate this.
package dbcontest.queryrunner.v1;

option go_package = "github.com/devrdn/db-contest/backend/internal/rpc/queryrunnerv1";

service QueryRunner {
  // Run checks one participant's query against the contest's policy and, if it
  // passes, executes it in that participant's own database.
  rpc Run(RunRequest) returns (RunResponse);
}

// Policy is the contest's answer to "what may a participant's SQL do".
//
// Sent with every request rather than held by the runner, because it belongs
// to the contest and the runner is stateless. It mirrors sqlpolicy.Policy;
// the fields are named the same so that a mismatch reads as one.
message Policy {
  // "read_only" or "read_write". Deliberately not an enum: the value is a
  // domain constant, and an enum here would be a second place to add one.
  string mode = 1;
  repeated string writable_tables = 2;
  bool allow_create_view = 3;
  bool allow_own_tables = 4;
  bool allow_temp_tables = 5;
  bool allow_catalog = 6;
}

message RunRequest {
  // The registration asking, which is what "one query at a time" counts: the
  // same person in two contests is two participants.
  string registration = 1;
  // The participant's own game database. It comes from game_instances on the
  // Core API's side and never from the client — section 5, point 1.
  string database = 2;
  string sql = 3;
  Policy policy = 4;
  // How large this participant's database may grow, in bytes. Computed on the
  // Core API's side from the template's size and the policy's ratio, and
  // checked by the runner before a write. Zero means no bound, which is what a
  // read-only contest sends.
  int64 disk_quota_bytes = 5;
}

message RunResponse {
  // Exactly one. A refusal, a timeout and a full instance are ordinary
  // outcomes of asking, not faults of the transport, so they travel in the
  // response rather than as a gRPC error status. A gRPC error from this call
  // means the runner could not be reached or could not answer at all.
  oneof outcome {
    Result result = 1;
    Failure failure = 2;
  }
}

message Result {
  repeated string columns = 1;
  repeated Row rows = 2;
  // The answer is longer than what is here — by rows, by bytes, or both. A
  // flag rather than a silent cut: a participant reading nine hundred rows of
  // a nine thousand row answer and not being told has a wrong answer, not a
  // short one.
  bool truncated = 3;
  // For a statement that changes the database: how many rows it changed. A
  // read leaves it at zero, and so does a write that returned rows through
  // RETURNING — those are the answer, and their count is the row count.
  int64 rows_affected = 4;
  // Each column's type, named as PostgreSQL's own format_type() would print
  // it — `text`, `timestamp with time zone`, `uuid`. The same vocabulary the
  // schema panel reads out of the catalogue, because the console shows the two
  // beside each other and two spellings of one type is read as two types.
  //
  // A parallel list rather than a field on a column message: `columns` is
  // already a repeated string on this contract, and widening it would mean a
  // runner and a Core API of different versions disagreeing about the shape of
  // every answer rather than about one optional extra.
  //
  // Either empty, or exactly as long as `columns` and in the same order. An
  // individual entry is empty for a type the runner could not name — an enum
  // or a domain an organiser's own script declared — because a participant's
  // SELECT must never fail over a label.
  repeated string column_types = 5;
  // How long the statement itself took, in microseconds.
  //
  // Microseconds rather than milliseconds because the console rounds to
  // milliseconds for display, and a limit expressed in the unit being
  // displayed makes every quick query "0 ms" — which reads as a broken meter
  // rather than as a fast query.
  //
  // The statement and nothing around it: not the connection, not admission
  // control, not this call. Those are the platform's costs, and a participant
  // shown them spends the contest optimising a join that was never slow.
  int64 duration_micros = 6;
}

message Row {
  repeated Cell cells = 1;
}

// Cell is one value, rendered.
//
// Text rather than a typed union, because the only consumer is a console that
// displays it. `is_null` is separate so that NULL and the empty string stay
// different, which in SQL they very much are.
message Cell {
  bool is_null = 1;
  string text = 2;
}

message Failure {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // The validator would not allow it. `code` and `subject` carry which rule
    // and which construct, so the Core API can say it in the participant's
    // own language rather than forwarding an English sentence.
    KIND_REFUSED = 1;
    // Admission control declined: the instance is full, or this participant
    // already has a query in flight.
    KIND_BUSY = 2;
    KIND_ALREADY_RUNNING = 3;
    // The runner's own deadline fired and the query was cancelled.
    KIND_TIMEOUT = 4;
    // The database refused it — a missing table, a type error, a privilege.
    KIND_DATABASE_ERROR = 5;
    // The caller stopped waiting. Separate from a timeout because only one of
    // the two is about load, and a report of "how often did queries run out of
    // time" is read as though it were.
    KIND_CANCELLED = 6;
    // The participant is asking faster than the contest allows. Separate from
    // BUSY: one is about this person's rate, the other about everyone's load,
    // and the sentence a participant should read differs.
    KIND_RATE_LIMITED = 7;
    // The write was refused because the participant's database is at its size
    // limit.
    KIND_DISK_FULL = 8;
    // The answer could not be read within the result budget at all — one row
    // alone was larger than the whole allowance, so there is no prefix of it
    // to show. Distinct from a truncated result, which is an answer.
    KIND_RESULT_TOO_LARGE = 9;
    // This service failed, and it is not about the query: the game cluster
    // could not be connected to, or something here went wrong. The database
    // never saw the SQL, so there is nothing in it for the participant to
    // fix — and `message` here is the one that must never be repeated to
    // them, because it carries the cluster's address and role names.
    //
    // Every kind above is an answer to the question that was asked. This one
    // says the question was never answered, which is why it is not
    // KIND_DATABASE_ERROR with a different sentence.
    KIND_INTERNAL = 10;
  }

  Kind kind = 1;
  string code = 2;
  string subject = 3;
  // For the journal and the technical log. Not for the participant: what they
  // are shown is chosen from `kind` and `code`.
  string message = 4;
  // Where in the query the refusal is about, as a 1-based **character**
  // offset — PostgreSQL's own errposition() convention, which the checker
  // gets verbatim from PostgreSQL's own parser. Zero means "no position", and
  // is true of every refusal but a parse error.
  //
  // Characters and not bytes, which is the whole reason this is worth a
  // sentence: a Cyrillic query is two bytes to the character in UTF-8, so a
  // consumer treating this as a byte offset underlines the wrong half of the
  // statement for every participant not writing in ASCII.
  //
  // It is on this contract because the checker runs inside the Query Runner
  // and the console only exists when QUERY_RUNNER_ADDR is set: without a
  // field here the value is produced on one side of the wire, read on the
  // other, and is zero in every deployed arrangement — the console's
  // underline built and dead (CLAUDE.md rule 11).
  int32 position = 5;
}
