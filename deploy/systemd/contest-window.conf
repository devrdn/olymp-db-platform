# The contest window: a backup every 15 minutes, so a lost disk costs at most
# 15 minutes of a contest. A drop-in for dbcontest-backup.timer, installed as
# dbcontest-backup.timer.d/contest-window.conf by
# `deploy/backups/schedule.sh contest`. The empty line clears the daily
# schedule rather than adding a second one beside it.
[Timer]
OnCalendar=
OnCalendar=*-*-* *:00/15:00
