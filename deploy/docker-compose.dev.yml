# Development overlay: infrastructure only.
#
# Run it with the base file to get PostgreSQL and Redis on the host, then run
# the API from your editor against them:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d pg-core redis
#
# The Makefile wraps this as `make dev-up`; `make run` and `make front` then run
# the API and the interface from the host against it.
#
# Ports are bound to loopback so the databases are never exposed to the local
# network.

name: db-contest

services:
  pg-core:
    ports:
      - "127.0.0.1:${CORE_DB_PORT:-5432}:5432"
    # Verbose statement logging is a development aid; it is far too noisy and
    # too revealing for a real contest.
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_min_duration_statement=0

  # In production this cluster has no port at all. Here it gets one, on
  # loopback, for two reasons: the role tests connect to it directly to prove
  # what a participant's role cannot do, and an author wants to look at a game
  # template by hand.
  pg-game:
    ports:
      - "127.0.0.1:${GAME_DB_PORT:-5433}:5432"

  # A second game cluster, for the tests and nothing else.
  #
  # Not a database inside pg-game, because on a game cluster the unit the
  # tests act on is the cluster: CREATE DATABASE and DROP DATABASE name
  # cluster-wide objects, and preparing the cluster rewrites the shared
  # game_reader, game_writer and game_author roles — the very roles a running
  # Query Runner authenticates as. Pointed at pg-game, the tests once took
  # those credentials away mid-session and left their own databases behind in
  # the cluster the product's disk quota is measured on. Here they can do
  # neither: nothing but the tests ever connects to this one.
  #
  # Written out rather than `extends: pg-game`, which would copy pg-game's
  # data volume along with everything else and put two servers on one data
  # directory. Its data lives in memory and dies with the container, and the
  # Makefile recreates the container for every run, so no run inherits what
  # the last one left. It is started by the test targets themselves (`make
  # test-game-build`, `make test-game`), never by `make dev-up`.
  #
  # The maintenance database ends in _test, which is how the tests recognise a
  # cluster that is theirs (internal/platform/storage/storagetest).
  pg-game-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: ${GAME_DB_USER:?set GAME_DB_USER in .env}
      POSTGRES_PASSWORD: ${GAME_DB_PASSWORD:?set GAME_DB_PASSWORD in .env}
      POSTGRES_DB: ${GAME_DB_NAME:-dbcontest_game}_test
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    # The settings pg-game runs with that a test can observe, so a guarantee
    # proved here is one the product's cluster keeps too (CLAUDE.md rule 10) —
    # including the per-process memory cap below, which the sandbox tests rely
    # on to prove a runaway query fails in one backend without crashing the
    # cluster.
    command:
      - postgres
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - max_connections=200
      # The same worker-pool pins pg-game runs with, so the memory the proof
      # observes is the product's: parallel workers and autovacuum workers are
      # counted, capped pools rather than open-ended.
      - -c
      - max_parallel_workers=4
      - -c
      - autovacuum_max_workers=2
    # RLIMIT_DATA per process, the same 256 MiB pg-game runs with: a backend
    # that tries to build more than this gets a NULL from malloc and raises
    # PostgreSQL's own "out of memory" ERROR, rather than the container's cgroup
    # limit being hit and the Linux OOM killer taking the backend (which the
    # postmaster treats as a crash, restarting every session). Shared memory —
    # shared_buffers and a parallel query's dynamic shared memory — is mapped
    # shared and does not count against this limit, so parallel queries still
    # run. See deploy/docker-compose.yml for the arithmetic tying it to the
    # container memory and the semaphore.
    ulimits:
      data: ${GAME_DB_PROCESS_MEMORY_BYTES:-268435456}
    # The product's /dev/shm and container memory, so the proof runs on the
    # deployment's configuration (CLAUDE.md rule 10): a parallel query's shared
    # memory has the same room, and the cgroup limit is interpolated from
    # GAME_DB_MEMORY_BYTES with pg-game's default, so the OOM-killer-versus-
    # clean-error behaviour the sandbox tests assert is the one production would
    # show, and the tests can read the limit back and compare.
    shm_size: 256mb
    mem_limit: ${GAME_DB_MEMORY_BYTES:-7516192768}
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${GAME_TEST_DB_PORT:-5434}:5432"
    # Over TCP, not the socket: during initialisation the image runs a
    # temporary server on the socket alone, and a socket check would call the
    # cluster ready before the real one — and the database — exist.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      timeout: 5s
      retries: 60
    # Off the internal network: nothing in the stack has any business reaching
    # the tests' cluster, and that network is the one whose two pinned proxy
    # addresses TRUSTED_PROXIES names.
    networks: [tests]

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  # The API and the one-shot jobs are run from the host during development.
  migrate:
    profiles: [full]

  bootstrap:
    profiles: [full]

  api:
    profiles: [full]
    environment:
      ENV: development
      LOG_LEVEL: debug
      # Plain HTTP locally: a browser discards a Secure cookie over HTTP, and
      # nobody could sign in.
      COOKIE_SECURE: "false"
    ports:
      # Reachable without going through the proxy, for debugging.
      - "127.0.0.1:${API_PORT:-8080}:8080"

  # The interface runs on the host during development (`make front`), so its
  # container joins the API in the profile that is off by default.
  web:
    profiles: [full]
    environment:
      NODE_ENV: development
      # No Caddy in this overlay, so no TLS: a Secure cookie would be
      # discarded by the browser and sign-in would fail on the next request.
      COOKIE_SECURE: "false"

  # The proxy exists to terminate TLS; running the API directly does not need it.
  caddy:
    profiles: [full]

  # A browser UI for the core database — dev only, and deliberately no more
  # than that: Adminer is a single ~50 MiB image with no server-side account
  # of its own and nothing to persist, unlike pgAdmin's own volume and
  # first-run master password. It authenticates as whatever Postgres role you
  # log in with, so access is exactly Postgres's own — nothing extra to lock
  # down, and nothing extra to configure to make it "safe for dev".
  adminer:
    image: adminer:4
    profiles: [dbui]
    restart: unless-stopped
    environment:
      # Pre-fills the connection form with the compose service name, so the
      # only fields left to type on the login screen are the credentials
      # already sitting in deploy/.env.
      ADMINER_DEFAULT_SERVER: pg-core
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      - pg-core
    # Without this it lands on Compose's separate default network instead of
    # the one pg-core is actually on, and "pg-core" would not resolve at all —
    # caught by trying to actually connect, not by reading the config.
    networks: [internal]

# The test cluster's own network (see pg-game-test above).
networks:
  tests: {}
