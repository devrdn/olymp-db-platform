# Scrape configuration for the DB Contest stack.
#
# The API exposes /metrics on its internal listener only; that port is never
# published to the host, so this file is the only thing that reads it.

global:
  scrape_interval: 15s
  # During a contest the interesting numbers move in seconds, not minutes.
  evaluation_interval: 15s

scrape_configs:
  - job_name: core-api
    static_configs:
      - targets: ["api:9090"]
        labels:
          service: core-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
