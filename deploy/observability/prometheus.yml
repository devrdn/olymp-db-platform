# Scrape configuration for the DB Contest stack.
#
# The API and the Query Runner expose /metrics on internal listeners only;
# those ports are never published to the host, so a scraper on the compose
# network (this one, or the host's collector) is the only thing that reads them.

global:
  scrape_interval: 15s
  # During a contest the interesting numbers move in seconds, not minutes.
  evaluation_interval: 15s

scrape_configs:
  # The containerized api (docker-compose.yml, `make stack-up`), reached by
  # its service name on the compose network.
  - job_name: core-api
    static_configs:
      - targets: ["api:9090"]
        labels:
          service: core-api

  # The same binary run directly on the host during development (`make run`,
  # alongside `make dev-up`). Docker Desktop's `host.docker.internal` reaches
  # the host from any container regardless of which network it is on, so this
  # needs no extra wiring beyond the API listening on all interfaces, which it
  # already does. Only one of these two jobs is ever actually up at a time —
  # the other just shows as a down target, which is the correct, harmless way
  # to represent "not running that way right now" rather than a config you
  # have to toggle by hand.
  - job_name: core-api-dev
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          service: core-api

  # The containerized Query Runner's own listener (QUERY_RUNNER_METRICS_ADDR),
  # apart from its token-guarded gRPC port. `make runner` keeps it on
  # loopback, so there is no host job for it; curl localhost:9101/metrics.
  - job_name: queryrunner
    static_configs:
      - targets: ["queryrunner:9101"]
        labels:
          service: queryrunner

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
