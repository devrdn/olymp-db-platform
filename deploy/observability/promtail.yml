# Ships container logs to Loki.
#
# The applications write structured JSON to stdout precisely so no parsing is
# needed here: the pipeline extracts the fields the queries use as labels and
# leaves the rest of the record intact.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            request_id: request_id
      # Only low-cardinality fields become labels. request_id stays in the
      # record body: one label value per request would multiply the number of
      # streams by the number of requests and bring the index down.
      - labels:
          level:
