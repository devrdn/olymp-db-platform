# Core stack for the DB Contest platform.
#
# Only the API's public port is published to the host. The core database, the
# cache and the API's internal listener (metrics, health) stay on the private
# network, reachable by name from other services but not from outside.
#
# The game cluster is a second PostgreSQL instance, deliberately separate from
# the core one: participants' queries run there, and its total degradation must
# not touch sign-in, answers or the timer.

name: db-contest

# The application images are pulled, not built here. Building on the machine
# that serves an olympiad would put the toolchain, the sources and a compile's
# worth of CPU on it, and — worse — what ran would be a different build from
# the one CI proved. docker-compose.build.yml adds the build definitions back
# for local work and for CI, which is the only place that builds them.
#
# One backend image carries all three binaries; api, migrate and bootstrap are
# the same image with different entrypoints.

services:
  pg-core:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CORE_DB_USER:?set CORE_DB_USER in .env}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in .env}
      POSTGRES_DB: ${CORE_DB_NAME:-dbcontest_core}
      # Scram is the default in PG16; stated explicitly so a base image change
      # cannot silently weaken it.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pg-core-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]

  # The game cluster: one database per participant, and nothing else.
  #
  # Separate from pg-core rather than a second database inside it, because the
  # isolation being bought is resource isolation as much as visibility. A
  # participant's runaway query should cost the game cluster's CPU and memory,
  # not the ones the timer and the answer submissions depend on.
  #
  # No published port here: a participant reaches this cluster only through the
  # interface, the API and the Query Runner, and section 4 is explicit that the
  # game cluster's port is not published. The development overlay binds one to
  # loopback so the role tests can connect as a participant's role and prove
  # what it cannot do — a guarantee asserted in a comment is not a guarantee.
  pg-game:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # The provisioning role. It owns the templates and creates participant
      # databases; the Query Runner never connects as this.
      POSTGRES_USER: ${GAME_DB_USER:?set GAME_DB_USER in .env}
      POSTGRES_PASSWORD: ${GAME_DB_PASSWORD:?set GAME_DB_PASSWORD in .env}
      POSTGRES_DB: ${GAME_DB_NAME:-dbcontest_game}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - postgres
      # Participant SQL is journalled by the application, in query_log, with
      # the participant and the contest attached (section 5, point 7). Logging
      # it here as well would duplicate every query into a file nobody reads
      # and ship it to Loki, where it becomes a second copy of the answers.
      - -c
      - log_statement=none
      # A connection that opens a transaction and stops is a lock held and a
      # slot spent. The Query Runner closes its connections, so this only ever
      # fires when something has already gone wrong.
      - -c
      - idle_in_transaction_session_timeout=30s
      # Headroom over the Query Runner's semaphore, not a substitute for it:
      # reaching this number means admission control has already failed.
      - -c
      - max_connections=200
      # Parallel worker processes are a cluster-wide pool, and each one can
      # reach the per-process memory cap below. Pinned so the memory arithmetic
      # (config.Runner.MaxParallelWorkers) can count them once against the
      # container rather than once per concurrent query. Participant queries
      # take at most one worker each (max_parallel_workers_per_gather on the
      # roles), so four is parallelism for up to four of the eight concurrent
      # queries at any moment — best effort, not a per-query guarantee.
      - -c
      - max_parallel_workers=4
      # Autovacuum workers also run under the cap; kept few so their worst-case
      # memory is a small, countable part of the reserve.
      - -c
      - autovacuum_max_workers=2
    volumes:
      - pg-game-data:/var/lib/postgresql/data
    # PostgreSQL puts the shared memory of a parallel query in /dev/shm, and
    # Docker's default for it is 64 MB. A few participants running a parallel
    # hash join at once exhaust that, and each of them is told "could not
    # resize shared memory segment … No space left on device" for a query
    # that was fine — the load test found it in 2% of a burst. 256 MB holds
    # what eight concurrent queries (QUERY_CONCURRENT) ask for; the pages
    # count against the memory limit below only while they are in use.
    shm_size: 256mb
    # The real bound on one query's memory: a per-process cap (RLIMIT_DATA) on
    # every backend. Nothing in SQL bounds the size of a value a query builds —
    # a string_agg or array_agg of a manufactured string over a long series
    # reaches PostgreSQL's ~1 GiB per-value ceiling, and the validator
    # deliberately does not try to (it is a first line only). Under this cap
    # such a query gets a NULL from malloc and raises PostgreSQL's own "out of
    # memory" ERROR in its own backend; the postmaster and every other session
    # are untouched. Without it the container's cgroup limit is reached instead
    # and the Linux OOM killer takes a backend, which the postmaster treats as
    # a crash and restarts every session. Shared memory — shared_buffers and a
    # parallel query's dynamic shared memory — is mapped shared and does not
    # count against RLIMIT_DATA, so parallel queries keep working. 256 MiB was
    # measured against this image: a template build's COPY (single values to
    # ~40 MiB) and index creation (maintenance_work_mem to ~240 MiB), CREATE
    # DATABASE … TEMPLATE and a VACUUM removing two million dead tuples at the
    # default maintenance_work_mem all succeed, while a gigabyte-scale value is
    # refused. The value comes from GAME_DB_PROCESS_MEMORY_BYTES, the one
    # source of truth: the Query Runner reads the same variable for its memory
    # arithmetic, and the game-prepare job reads the running limit back from
    # /proc and proves it equals this before the cluster serves anything.
    ulimits:
      data: ${GAME_DB_PROCESS_MEMORY_BYTES:-268435456}
    # cgroup limits, so that "the game cluster degrades" stays a statement
    # about this container rather than about the machine. Sized for the
    # pilot; raise them together with the semaphore in section 4.3.
    #
    # Memory follows from the cap above, the concurrency, the worker pool and
    # builds. Three classes of backend can each reach the 256 MiB cap:
    # QUERY_CONCURRENT query leaders; the cluster-wide parallel-worker pool
    # (max_parallel_workers above, counted once, not per query); and up to
    # game_author's CONNECTION LIMIT provisioning build sessions, which run an
    # organiser's arbitrary script and can allocate as much as a participant
    # (a build can coincide with a contest). So the container must hold
    # (QUERY_CONCURRENT + max_parallel_workers + build sessions) × 256 MiB plus
    # ~2 GiB reserved for shared_buffers, the /dev/shm parallel segment
    # (256 MiB), the postmaster and background workers, the autovacuum workers
    # and the provisioner's own CREATE DATABASE / COPY sessions:
    # (8 + 4 + 4) × 256 MiB + 2 GiB = 6 GiB at the default concurrency, rounded
    # up here to seven. Measured legitimate ceilings under the cap (for an
    # operator tuning these): a single COPY value up to ~40 MiB, CREATE INDEX /
    # REINDEX up to maintenance_work_mem ~240 MiB, JIT-compiled queries
    # (~130 MiB peak), and parallel queries whose shared memory does not count
    # against the cap. The limit below is interpolated from
    # GAME_DB_MEMORY_BYTES, the one variable for it: the Query Runner checks its
    # arithmetic against the same value, and the game-prepare job reads the
    # container's real limit back from its cgroup and refuses to finish when
    # they differ. Lower QUERY_CONCURRENT and the limit can come down with it.
    deploy:
      resources:
        limits:
          cpus: "${GAME_DB_CPUS:-2.0}"
          memory: ${GAME_DB_MEMORY_BYTES:-7516192768}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]

  # One-shot job: creates the game cluster's three roles — the two the Query
  # Runner connects as and the one an organiser's game script runs as — their
  # session defaults and the revocations, then exits. Idempotent, and run on
  # every deploy so a restriction added in a later release reaches a cluster
  # that already exists — which an image init script, running only when the
  # data directory is created, silently would not.
  game-prepare:
    image: ${REGISTRY:-ghcr.io/devrdn}/db-contest-queryrunner:${VERSION:-dev}
    restart: "no"
    entrypoint: ["/usr/local/bin/gamedb"]
    environment:
      GAME_DB_ADMIN_DSN: postgres://${GAME_DB_USER}:${GAME_DB_PASSWORD}@pg-game:5432/${GAME_DB_NAME:-dbcontest_game}?sslmode=disable
      GAME_READER_PASSWORD: ${GAME_READER_PASSWORD:?set GAME_READER_PASSWORD in .env}
      GAME_WRITER_PASSWORD: ${GAME_WRITER_PASSWORD:?set GAME_WRITER_PASSWORD in .env}
      # The third role, the one an organiser's game script runs as. This job
      # is the only place any of the three is created, so leaving it out here
      # is a cluster with no game_author on it at all — and `gamedb` refuses
      # to run without it rather than silently preparing two roles of three.
      GAME_AUTHOR_PASSWORD: ${GAME_AUTHOR_PASSWORD:?set GAME_AUTHOR_PASSWORD in .env}
      # The per-process memory cap (pg-game's ulimits.data), so this job proves
      # at deploy time that the cap is in force — a throwaway session allocating
      # over it must be refused with "out of memory", one allocating a quarter
      # of it must succeed — and fails the preparation with a clear error if it
      # is not. The same variable the ulimit above is interpolated from.
      GAME_DB_PROCESS_MEMORY_BYTES: ${GAME_DB_PROCESS_MEMORY_BYTES:-268435456}
      # The container memory limit, so this job also reads pg-game's real limit
      # from its cgroup (/sys/fs/cgroup/memory.max) and refuses to finish when
      # it is not this value, and checks that the role limit and worker pins
      # the Query Runner's arithmetic restates are what the cluster runs with.
      GAME_DB_MEMORY_BYTES: ${GAME_DB_MEMORY_BYTES:-7516192768}
      # Only for a host whose containers cannot report their memory limit
      # (cgroup v1, no cgroup namespace): "true" lets the deploy finish without
      # confirming it, with a warning. Leave unset everywhere else.
      GAME_DB_ALLOW_UNREADABLE_MEMORY_LIMIT: ${GAME_DB_ALLOW_UNREADABLE_MEMORY_LIMIT:-}
    depends_on:
      pg-game:
        condition: service_healthy
    networks: [internal]

  # The Query Runner: the one component that is a separate service.
  #
  # Two things are true of it and of nothing else here. It links PostgreSQL's
  # own parser through cgo to check a query before running it — C code reading
  # text an adversary chooses, where a crash ends the process rather than
  # raising an error — so inside the Core API a crafted query would be a
  # repeatable way to end sign-in, the timer and the submission of answers. And
  # it is the only process holding the game cluster's credentials: the API is
  # deliberately given no route to a participant's database.
  #
  # No published port, and no core database: it is stateless, and what it knows
  # about a request is what the request carries.
  queryrunner:
    image: ${REGISTRY:-ghcr.io/devrdn}/db-contest-queryrunner:${VERSION:-dev}
    restart: unless-stopped
    environment:
      ENV: ${ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Every interface of this container, inside a network nothing outside
      # routes into. Named here because the binary's own default is loopback.
      QUERY_RUNNER_ADDR: ":9100"
      # The secret every call must carry, the health check's included (it
      # reads it from this same environment). Required outside development:
      # the runner refuses to start without it. Passed empty rather than
      # required here so that compose commands that do not start the runner
      # still read an .env without it.
      QUERY_RUNNER_TOKEN: ${QUERY_RUNNER_TOKEN:-}
      # As the participant's role, never the provisioning one. The database in
      # this URL is a placeholder: the runner replaces it per request with the
      # participant's own, taken from game_instances by the Core API. Only the
      # credentials here are ever used.
      GAME_DB_DSN: postgres://game_reader:${GAME_READER_PASSWORD}@pg-game:5432/postgres?sslmode=disable
      # The writer role, for contests whose policy permits writing (section
      # 4.1). Which of the two a query runs as is the policy's decision; without
      # this a read-write contest is refused rather than run as the reader.
      GAME_DB_WRITER_DSN: postgres://game_writer:${GAME_WRITER_PASSWORD}@pg-game:5432/postgres?sslmode=disable
      QUERY_DEADLINE: ${QUERY_DEADLINE:-5s}
      QUERY_MAX_ROWS: ${QUERY_MAX_ROWS:-1000}
      QUERY_MAX_BYTES: ${QUERY_MAX_BYTES:-5242880}
      # Two to three times the cores of the game cluster (section 4.3). The
      # queue is sized from the roster instead: the two together at or above
      # the number of participants (see deploy/.env.example).
      QUERY_CONCURRENT: ${QUERY_CONCURRENT:-8}
      QUERY_QUEUE_DEPTH: ${QUERY_QUEUE_DEPTH:-32}
      QUERY_PER_MINUTE: ${QUERY_PER_MINUTE:-30}
      # The game cluster's container memory limit — the same variable, and the
      # same default, pg-game's limit is interpolated from — so the runner
      # refuses to start with a concurrency the cluster cannot hold (see
      # pg-game above). Unset means the default; the check always runs.
      GAME_DB_MEMORY_BYTES: ${GAME_DB_MEMORY_BYTES:-7516192768}
      # The per-process cap the runner's arithmetic multiplies — the same value
      # the pg-game ulimit is interpolated from, so the two cannot drift.
      GAME_DB_PROCESS_MEMORY_BYTES: ${GAME_DB_PROCESS_MEMORY_BYTES:-268435456}
      # Functions an operator added to the allow-list after a pilot, without
      # waiting for a release. Comma-separated.
      QUERY_EXTRA_FUNCTIONS: ${QUERY_EXTRA_FUNCTIONS:-}
    depends_on:
      pg-game:
        condition: service_healthy
      game-prepare:
        condition: service_completed_successfully
    healthcheck:
      # Distroless carries no shell and no gRPC probe, so the binary dials its
      # own listener.
      test: ["CMD", "/usr/local/bin/queryrunner", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]

  # Optional. Start it with the "shared" profile:
  #   docker compose --profile shared up -d
  # Without it the API uses its in-process cache, which is correct for a single
  # replica and wrong for several — see backend/README.md.
  redis:
    image: redis:7-alpine
    profiles: [shared]
    restart: unless-stopped
    # Sessions and rate-limit windows must survive a restart of the cache, so
    # appendonly is on.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  # One-shot job: applies pending migrations, then exits. The API waits for it
  # to finish successfully, so no replica ever serves an unmigrated schema.
  migrate:
    image: ${REGISTRY:-ghcr.io/devrdn}/db-contest-backend:${VERSION:-dev}
    restart: "no"
    entrypoint: ["/usr/local/bin/migrate", "up"]
    environment:
      CORE_DB_DSN: postgres://${CORE_DB_USER}:${CORE_DB_PASSWORD}@pg-core:5432/${CORE_DB_NAME:-dbcontest_core}?sslmode=disable
    depends_on:
      pg-core:
        condition: service_healthy
    networks: [internal]

  # One-shot job: creates the first administrator if there is none, and prints
  # its one-time password to the job log. Run it once after the first deploy:
  #   docker compose --profile bootstrap run --rm bootstrap
  bootstrap:
    image: ${REGISTRY:-ghcr.io/devrdn}/db-contest-backend:${VERSION:-dev}
    profiles: [bootstrap]
    restart: "no"
    # The job prints the administrator's one-time password. With the default
    # driver that line becomes a container log — persisted by Docker and, with
    # the observability profile on, shipped to Loki for 30 days. Driver "none"
    # keeps it off disk entirely; an attached `compose run` still shows it,
    # because the terminal stream does not go through the logging driver.
    logging:
      driver: none
    entrypoint: ["/usr/local/bin/bootstrap"]
    command: ["-login", "${ADMIN_LOGIN:-admin}", "-name", "${ADMIN_NAME:-System Administrator}"]
    environment:
      CORE_DB_DSN: postgres://${CORE_DB_USER}:${CORE_DB_PASSWORD}@pg-core:5432/${CORE_DB_NAME:-dbcontest_core}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  api:
    image: ${REGISTRY:-ghcr.io/devrdn}/db-contest-backend:${VERSION:-dev}
    restart: unless-stopped
    environment:
      ENV: ${ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      INTERNAL_ADDR: ":9090"
      CORE_DB_DSN: postgres://${CORE_DB_USER}:${CORE_DB_PASSWORD}@pg-core:5432/${CORE_DB_NAME:-dbcontest_core}?sslmode=disable
      # Empty selects the in-process cache. Set it (and start the "shared"
      # profile) as soon as more than one replica runs.
      REDIS_ADDR: ${REDIS_ADDR:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      METRICS_BACKEND: ${METRICS_BACKEND:-prometheus}
      # The language a request that expresses no usable preference falls back
      # to. It must name a row in the `languages` table (en, ro, ru are
      # seeded), which is why it is an operator's choice and not a constant.
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      SESSION_TTL: ${SESSION_TTL:-12h}
      # How long a session may exist from sign-in, however actively it is
      # used (5m to 168h). SESSION_TTL above slides with activity and so never
      # ends a session somebody keeps using, a copied cookie included.
      SESSION_MAX_LIFETIME: ${SESSION_MAX_LIFETIME:-12h}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # The compose network: Caddy's X-Forwarded-For is believed, a direct
      # client's is not. Without this, every request appears to come from the
      # proxy and the per-IP login throttle becomes one global counter.
      # The two containers that actually front a browser, and only those.
      # A forwarded address decides the audit trail, the per-address login
      # throttle and a contest's network restriction, so trusting the whole
      # compose subnet would let any container on it — promtail, which mounts
      # the Docker socket, among them — assert whatever address it liked.
      # Addresses rather than names because the resolver reads CIDRs at
      # startup, which is why the two are pinned below.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.10/32,172.28.0.11/32}
      # Front origins this API answers for on top of its own host, for the
      # cross-origin guard. Empty is right behind the bundled Caddy, which
      # passes the browser's Host through — but it has to be *passed* even so:
      # without this line a deployment whose interface answers on another name
      # sets PUBLIC_ORIGINS in .env, restarts, and still gets 403 on every
      # chunk upload, with nothing in the log to say why (.env.example has
      # documented it since the guard was written).
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-}
      # Counts successful sign-ins too, so it bounds people rather than only
      # guesses. Raise it where a whole cohort shares one NAT address; the
      # limit of ten per account and address is what stops guessing.
      MAX_LOGIN_ATTEMPTS_PER_ADDRESS: ${MAX_LOGIN_ATTEMPTS_PER_ADDRESS:-300}
      # Attempts at one account from every address together, per quarter
      # hour: the backstop against a guess spread across many addresses. Far
      # above what one person mistyping reaches, so somebody else's wrong
      # guesses cannot shut an owner out below it.
      MAX_LOGIN_ATTEMPTS_PER_ACCOUNT: ${MAX_LOGIN_ATTEMPTS_PER_ACCOUNT:-100}
      # A browser that has signed in to an account gets a signed cookie, and
      # its later sign-ins to that account are limited per browser instead of
      # per address — what keeps a rival in the same lecture hall from locking
      # the owner out. The secret signs it: at least 32 bytes, required outside
      # development (the API refuses to start without it), and the same on
      # every replica. Passed empty rather than required here so that compose
      # commands that do not start the API still read an .env without it.
      DEVICE_COOKIE_SECRET: ${DEVICE_COOKIE_SECRET:-}
      DEVICE_COOKIE_TTL: ${DEVICE_COOKIE_TTL:-720h}
      MAX_LOGIN_ATTEMPTS_PER_DEVICE: ${MAX_LOGIN_ATTEMPTS_PER_DEVICE:-10}
      # Every trusted browser of one account together. A success resets
      # neither limit, and past either an attempt pays the ordinary limits
      # above, so an account's own cookies cannot sign in without end.
      MAX_TRUSTED_LOGIN_ATTEMPTS_PER_ACCOUNT: ${MAX_TRUSTED_LOGIN_ATTEMPTS_PER_ACCOUNT:-20}
      # How many argon2id computations — sign-in, password changes, issuing
      # passwords — run at once. Each holds 64 MiB, so this is a memory figure
      # and the limits below are sized from it; stated here rather than left
      # to the per-CPU default, which would make the arithmetic depend on the
      # host. A request that finds every slot taken waits up to
      # PASSWORD_HASH_MAX_WAIT and is then answered 503 sign_in_busy.
      PASSWORD_HASH_CONCURRENCY: ${PASSWORD_HASH_CONCURRENCY:-4}
      PASSWORD_HASH_MAX_WAIT: ${PASSWORD_HASH_MAX_WAIT:-2s}
      # The Go runtime's soft memory target: it collects harder as the heap
      # approaches this, instead of growing until the container is killed.
      #   hashing:  PASSWORD_HASH_CONCURRENCY × 64 MiB = 4 × 64 MiB =  256 MiB
      #   base:     runtime, connection pools, the in-process session and
      #             rate-limit cache, console results relayed from the Query
      #             Runner (QUERY_CONCURRENT + QUERY_QUEUE_DEPTH = 40 of up to
      #             QUERY_MAX_BYTES = 5 MiB, decoded and re-encoded) and
      #             8 MiB upload chunks                               = 1024 MiB
      #   GOMEMLIMIT                                                   = 1280 MiB
      # The base is an estimate, not a measured peak. The API logs a warning
      # at start-up when GOMEMLIMIT is below concurrency × 64 MiB + 1 GiB.
      # Raise PASSWORD_HASH_CONCURRENCY and this figure rises by 64 MiB a slot.
      GOMEMLIMIT: ${API_GOMEMLIMIT:-1280MiB}
      # The provisioning role, not a participant's: this creates and drops
      # databases and never runs anybody's SQL. The Query Runner holds the
      # participant credentials and this process does not.
      GAME_PROVISIONER_DSN: postgres://${GAME_DB_USER}:${GAME_DB_PASSWORD}@pg-game:5432/${GAME_DB_NAME:-dbcontest_game}?sslmode=disable
      # The role an organiser's uploaded game script is run as — never the
      # provisioning one above, which is the whole point of a separate role.
      # config.Load refuses to start when GAME_PROVISIONER_DSN is set and this
      # is not, and the DSN above is always set here, so without this line a
      # compose deployment does not come up at all.
      GAME_AUTHOR_PASSWORD: ${GAME_AUTHOR_PASSWORD:?set GAME_AUTHOR_PASSWORD in .env}
      GAME_POOL_DEPTH: ${GAME_POOL_DEPTH:-10}
      # The ceiling on what one contest may ask the game cluster to hold. The
      # depth above is headroom on top of the roster, so a mistyped roster is
      # a request for a database per name in it; this is what stops that
      # filling a disk. It is a cap an operator sizes against their own
      # cluster, so it has to reach the container — a compiled default is a
      # cap nobody chose.
      GAME_POOL_MAX: ${GAME_POOL_MAX:-500}
      # And the bound that is actually about the disk. GAME_POOL_MAX counts
      # copies; this counts bytes, which is what a volume runs out of — a
      # count means nothing without the size of a copy. Sized against the
      # volume this cluster sits on, so it reaches the container for the same
      # reason the cap above does.
      GAME_CLUSTER_MAX_BYTES: ${GAME_CLUSTER_MAX_BYTES:-68719476736}
      GAME_PROVISION_WORKERS: ${GAME_PROVISION_WORKERS:-3}
      # How long one run of an organiser's script — editor or uploaded dump —
      # may take. Sized against the largest dump this installation expects and
      # the disk it lands on, so it is an operator's choice and has to reach
      # the container; .env.example has always said so, and this line is what
      # makes saying so true.
      GAME_BUILD_TIMEOUT: ${GAME_BUILD_TIMEOUT:-30m}
      GAME_COPY_STRATEGY: ${GAME_COPY_STRATEGY:-}
      # How long a finished contest's participant databases survive, for every
      # contest whose organizer left settings.grace_period_min at zero
      # (docs/ARCHITECTURE.md §2.4). Decided here and applied by the reclaim
      # sweep, so it crosses this boundary or the sweep runs on a default
      # nobody chose (CLAUDE.md rule 11).
      GAME_INSTANCE_GRACE_MIN: ${GAME_INSTANCE_GRACE_MIN:-1440}
      # The console reaches the Query Runner over the private network; the
      # runner's own port is published nowhere.
      QUERY_RUNNER_ADDR: ${QUERY_RUNNER_ADDR:-queryrunner:9100}
      # The same secret the queryrunner service is given, presented on every
      # call: the runner runs whatever database a request names and answers
      # only the Core API. Required outside development when the address above
      # is set (the API refuses to start without it).
      QUERY_RUNNER_TOKEN: ${QUERY_RUNNER_TOKEN:-}
      # The same figure the queryrunner service below is given, so the
      # console's own pre-check (ahead of the query journal) refuses a
      # participant asking too fast at the same rate the Query Runner would —
      # not the architecture's own default, which may not be what this
      # deployment actually runs with.
      QUERY_PER_MINUTE: ${QUERY_PER_MINUTE:-30}
      # Answers one registration may submit a minute, refused ones included
      # (1-60). Its own budget, far below QUERY_PER_MINUTE: an answer is a
      # guess, and a fast stream of guesses solves a question by elimination.
      ANSWER_RATE_PER_MINUTE: ${ANSWER_RATE_PER_MINUTE:-6}
      # The contest clock's own grace (docs/ARCHITECTURE.md §8) — not
      # QUERY_DEADLINE above, which is the Query Runner's unrelated per-query
      # execution timeout. This one is consumed here, by queryproxy.Service,
      # never by the Query Runner.
      DEADLINE_GRACE: ${DEADLINE_GRACE:-5s}
      # An organiser's second way to build a contest's game: upload a
      # finished SQL dump instead of writing one in the editor. Empty turns
      # it off, the same convention QUERY_RUNNER_ADDR uses above — an
      # installation that never mounts game-uploads-data still starts
      # cleanly, with this feature simply unavailable. Set together with the
      # volume below: a directory this process cannot write to is a
      # misconfiguration this variable alone cannot catch.
      GAME_UPLOAD_DIR: ${GAME_UPLOAD_DIR:-/var/lib/dbcontest/uploads}
      # Above the 1-3 GB the pilot itself named as its own ceiling, on
      # purpose: the first organiser to approach a number somebody guessed
      # at design time should get a slow upload, not a refusal they have no
      # way to raise themselves.
      GAME_UPLOAD_MAX_FILE_BYTES: ${GAME_UPLOAD_MAX_FILE_BYTES:-4294967296}
      # Every upload the volume holds together — in progress, and complete
      # ones still waiting to be superseded or reclaimed. Sized against the
      # volume below, the same way GAME_CLUSTER_MAX_BYTES is sized against
      # the game cluster's own.
      GAME_UPLOAD_MAX_DIR_BYTES: ${GAME_UPLOAD_MAX_DIR_BYTES:-17179869184}
      # The table builder's own per-table CSV data — a second, independent
      # gamefile.Store on this same volume, with its own ceiling rather than
      # silently sharing the one above (.env.example's own doc on why).
      GAME_UPLOAD_TABLE_MAX_DIR_BYTES: ${GAME_UPLOAD_TABLE_MAX_DIR_BYTES:-4294967296}
      GAME_UPLOAD_CHUNK_BYTES: ${GAME_UPLOAD_CHUNK_BYTES:-8388608}
      # How long an upload may sit untouched before the janitor
      # (internal/app/background.go) aborts it and frees the disk. A day: an
      # organiser stepping away mid-upload does not lose their place, and a
      # browser tab closed mid-upload does not hold gigabytes indefinitely.
      GAME_UPLOAD_ABANDONED_AFTER: ${GAME_UPLOAD_ABANDONED_AFTER:-24h}
    # The hard ceiling: 3 GiB, generous headroom over GOMEMLIMIT's 1280 MiB,
    # not a measured peak — nobody has measured this process's peak under a
    # contest's load yet. GOMEMLIMIT is a target the collector works towards,
    # not a wall; live data can exceed it, and this ceiling exists so the
    # kernel kills a runaway process rather than the host, not to be reached
    # by an honest burst — being killed would end every participant's session
    # at once. Lower it only with a measurement to lower it to.
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_BYTES:-3221225472}
    # No host port: Caddy is the only way in. The development overlay exposes
    # the API directly for debugging.
    # game-uploads-data is local to this container's own host. It works
    # exactly as long as the api service has one replica: a chunk of one
    # upload can land on whichever replica received that request, and two
    # replicas would each hold half a file neither can complete. This is
    # fine for the pilot and wrong the day a second replica is added — fix
    # it (a shared filesystem, or routing an upload's chunks back to the
    # replica that began it) before that happens, not after.
    volumes:
      - game-uploads-data:${GAME_UPLOAD_DIR:-/var/lib/dbcontest/uploads}
    depends_on:
      pg-core:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Distroless carries no shell or curl, so the binary probes itself.
      test: ["CMD", "/usr/local/bin/api", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]

  # The participant and administrator interface.
  #
  # It reaches the API over the internal network rather than through Caddy: the
  # browser and the server talk to two different addresses on purpose. A page
  # request from the browser is same-origin through the proxy, which is what
  # makes the SameSite=Lax session cookie sufficient; the server rendering that
  # page dials the API directly, which is why API_ORIGIN is a service name and
  # not a public one.
  web:
    image: ${REGISTRY:-ghcr.io/devrdn}/db-contest-frontend:${VERSION:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_ORIGIN: ${API_ORIGIN:-http://api:8080}
      # The same value the API gets, and it has to be: the API issues the
      # session cookie and the interface writes it on to the browser, so two
      # different answers here mean a cookie the browser throws away. Caddy
      # terminates TLS in front, hence true.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # The secret Caddy proves itself with (deploy/Caddyfile). The address a
      # request says it came from is handed to the API only when it carries
      # this, because the API believes whatever this service hands on. Unset,
      # nothing is handed on and every visitor counts as this container.
      INGRESS_SECRET: ${INGRESS_SECRET:-}
    # No host port: Caddy is the only way in, exactly as for the API.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Pinned so TRUSTED_PROXIES can name this container and not its neighbours.
    networks:
      internal:
        ipv4_address: 172.28.0.11

  # The only service reachable from outside. It terminates TLS, which the
  # session cookie depends on: a Secure cookie sent over plain HTTP is
  # discarded by the browser, and sign-in would fail on the request after it.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      # Added to every request forwarded to web, replacing any value a client
      # sent; the same value web is given (see the Caddyfile).
      INGRESS_SECRET: ${INGRESS_SECRET:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    # Pinned for the same reason as web: it is the outermost hop whose
    # X-Forwarded-For the API believes.
    networks:
      internal:
        ipv4_address: 172.28.0.10

  # --- Observability -------------------------------------------------------
  # Optional, and off by default so a small install stays small:
  #   docker compose --profile observability up -d
  # Without it, set METRICS_BACKEND=log so request statistics go to the log
  # stream rather than to an endpoint nobody reads.

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]

  loki:
    image: grafana/loki:3.3.2
    profiles: [observability]
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks: [internal]

  # Ships container stdout to Loki. It reads the Docker socket read-only to
  # discover containers; nothing is written back through it.
  promtail:
    image: grafana/promtail:3.3.2
    profiles: [observability]
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks: [internal]

  grafana:
    image: grafana/grafana:11.5.1
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      # Dashboards are for operators, not the public: no sign-up, no anonymous
      # access, and the port stays on loopback.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks: [internal]

volumes:
  pg-core-data:
  pg-game-data:
  redis-data:
  # An organiser's uploaded SQL dumps, in progress and complete
  # (internal/gamefile). Local to the one host this volume lives on — see
  # the api service's own comment above for what that costs the day a
  # second replica is added.
  game-uploads-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  internal:
    driver: bridge
    # Pinned so TRUSTED_PROXIES can name it deterministically: the API must
    # know which peers are "our proxy" to resolve real client addresses from
    # X-Forwarded-For instead of seeing Caddy for every request.
    ipam:
      config:
        - subnet: 172.28.0.0/16
          # Leaves .1–.15 free for the fixed assignments above; everything
          # else is handed out from here and is not trusted to forward.
          ip_range: 172.28.16.0/20
